# Compose reads `.env` (repo root) for the ${...} values below.
#
# NOTE: `.env`'s own DATABASE_URL points at localhost:5439 — that is for
# host-side tooling only (`prisma studio`, `prisma migrate dev`, `bun run dev`).
# It is deliberately NOT reused here: inside the Docker network the database is
# reachable as `db:5432`, so the container-side DATABASE_URL is derived from the
# POSTGRES_* values instead. Service name and URL host must stay in sync.
name: ${COMPOSE_PROJECT_NAME:-novel-translator}

services:
  db:
    image: postgres:17-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-novel-translator}_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    # Host-bound to localhost only (SPEC.md §7.2) — nothing outside the Docker
    # network needs to reach Postgres directly, and on the VPS this port must
    # not be internet-reachable. 5439 avoids clashing with a system Postgres.
    ports:
      - "${DB_BIND_ADDRESS:-127.0.0.1}:${DB_PORT:-5439}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    container_name: ${COMPOSE_PROJECT_NAME:-novel-translator}_migrate
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    # Migrate, then create the default account if BOOTSTRAP_USER_* is set and
    # that email doesn't exist yet. The second step is what stops the first
    # deploy from showing an empty library: books predating auth are unowned,
    # and the first account created adopts them.
    # `bun`, not `bunx tsx`: the runtime here is Bun, which runs TypeScript
    # natively, while tsx is a Node loader and fails under it with
    # "Cannot find module './cjs/index.cjs'". `--conditions=react-server` is
    # load-bearing — without it the `import "server-only"` guard at the top of
    # src/lib/* throws instead of compiling away.
    command: >
      sh -c "bunx prisma migrate deploy &&
             bun --conditions=react-server scripts/bootstrap-user.ts"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      # Needed to wrap the new user's data key. This is the only service built
      # from the `builder` stage, i.e. the one image that still has scripts/ and
      # tsx — the production `runner` image holds just .next/standalone and
      # could not run these scripts.
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?APP_ENCRYPTION_KEY is required}
      # Default account. Optional: leave unset and create accounts by hand with
      #   docker compose run --rm migrate \
      #     bun --conditions=react-server scripts/create-user.ts you@example.com
      # An existing account is never modified, so changing the password here
      # after first deploy has no effect — by design, so a stale value can't
      # become a permanent backdoor.
      BOOTSTRAP_USER_EMAIL: ${BOOTSTRAP_USER_EMAIL:-}
      BOOTSTRAP_USER_PASSWORD: ${BOOTSTRAP_USER_PASSWORD:-}
      BOOTSTRAP_USER_NAME: ${BOOTSTRAP_USER_NAME:-}
    depends_on:
      db:
        condition: service_healthy
    # No restart: `db`'s healthcheck already guarantees the server is accepting
    # connections before this runs, so a failure here is a real migration
    # problem. Retrying would just print the same error N times and hide it.
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-novel-translator}_app
    restart: unless-stopped
    ports:
      - "${APP_BIND_ADDRESS:-0.0.0.0}:${APP_PORT:-3007}:3007"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
      # Root key for stored API keys (SPEC.md §8). Required: without it the
      # Settings page cannot save or read a key, and starting without one
      # would look like data loss rather than a missing secret.
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?APP_ENCRYPTION_KEY is required}
      # Behind a reverse proxy, NextAuth needs the public origin to build
      # callback URLs; without it a login redirect can land on the container's
      # own host name.
      AUTH_TRUST_HOST: "true"
      AUTH_URL: ${AUTH_URL:-}
      TRANSLATION_PROVIDER: ${TRANSLATION_PROVIDER:-claude}
      DEFAULT_MAX_CHARS: ${DEFAULT_MAX_CHARS:-3000}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?ANTHROPIC_API_KEY is required}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?GEMINI_API_KEY is required}
      NODE_ENV: production
      # Optional overrides (SPEC.md §7) — uncomment to set a non-default model:
      # TRANSLATION_MODEL: claude-opus-5
      # TRANSLATION_EFFORT: medium
      # GEMINI_MODEL: gemini-flash-latest
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
