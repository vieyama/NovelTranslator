kind: pipeline
type: docker
name: deploy

trigger:
  branch:
    - main
  event:
    - push

steps:
  # ─────────────────────────────────────────
  # 1. Write .env file from secrets
  # ─────────────────────────────────────────
  - name: write-env
    image: alpine
    environment:
      POSTGRES_USER:
        from_secret: POSTGRES_USER
      POSTGRES_PASSWORD:
        from_secret: POSTGRES_PASSWORD
      POSTGRES_DB:
        from_secret: POSTGRES_DB
      APP_PORT:
        from_secret: APP_PORT
      TRANSLATION_PROVIDER:
        from_secret: TRANSLATION_PROVIDER
      ANTHROPIC_API_KEY:
        from_secret: ANTHROPIC_API_KEY
      GEMINI_API_KEY:
        from_secret: GEMINI_API_KEY
      MISTRAL_API_KEY:
        from_secret: MISTRAL_API_KEY
      OPENROUTER_API_KEY:
        from_secret: OPENROUTER_API_KEY
      AUTH_SECRET:
        from_secret: AUTH_SECRET
      APP_ENCRYPTION_KEY:
        from_secret: APP_ENCRYPTION_KEY
      AUTH_URL:
        from_secret: AUTH_URL
      BOOTSTRAP_USER_EMAIL:
        from_secret: BOOTSTRAP_USER_EMAIL
      BOOTSTRAP_USER_PASSWORD:
        from_secret: BOOTSTRAP_USER_PASSWORD
    commands:
      # No DATABASE_URL here on purpose: docker-compose.yml derives the
      # container-side URL from POSTGRES_* with host `db` (the service name).
      # A DATABASE_URL in .env would be silently ignored by compose, so
      # setting one would only invite host mismatches.
      - |
        cat > /drone/src/.env <<EOF
        POSTGRES_USER=$${POSTGRES_USER}
        POSTGRES_PASSWORD=$${POSTGRES_PASSWORD}
        POSTGRES_DB=$${POSTGRES_DB}
        APP_BIND_ADDRESS=0.0.0.0
        APP_PORT=$${APP_PORT}
        TRANSLATION_PROVIDER=$${TRANSLATION_PROVIDER}
        ANTHROPIC_API_KEY=$${ANTHROPIC_API_KEY}
        GEMINI_API_KEY=$${GEMINI_API_KEY}
        MISTRAL_API_KEY=$${MISTRAL_API_KEY}
        OPENROUTER_API_KEY=$${OPENROUTER_API_KEY}
        AUTH_SECRET=$${AUTH_SECRET}
        APP_ENCRYPTION_KEY=$${APP_ENCRYPTION_KEY}
        AUTH_URL=$${AUTH_URL}
        BOOTSTRAP_USER_EMAIL=$${BOOTSTRAP_USER_EMAIL}
        BOOTSTRAP_USER_PASSWORD=$${BOOTSTRAP_USER_PASSWORD}
        COMPOSE_PROJECT_NAME=novel-translator
        EOF

  # ─────────────────────────────────────────
  # 2. Deploy via Docker Compose
  # ─────────────────────────────────────────
  - name: deploy
    image: docker:24-cli
    volumes:
      - name: docker-sock
        path: /var/run/docker.sock
    commands:
      - apk add --no-cache docker-cli-compose
      - cd /drone/src
      - docker compose down --remove-orphans
      # `app` gates on `migrate` completing successfully, so a failed migration
      # makes `up` exit non-zero with only "dependency failed to start" — the
      # actual reason is in `migrate`'s log. Drone's shell is `sh -e`, so print
      # it here or the step dies before the log line below ever runs.
      - docker compose up -d --build || { docker compose logs migrate; exit 1; }
      - docker compose logs migrate
      - docker compose ps

volumes:
  - name: docker-sock
    host:
      path: /var/run/docker.sock

---
kind: secret
name: POSTGRES_USER
get:
  path: drone/data/vieyama/novel-translator
  name: POSTGRES_USER

